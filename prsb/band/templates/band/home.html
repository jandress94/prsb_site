{% extends "band/base.html" %}

{% block title %}Choose a band{% endblock %}

{% block nav %}
    Home
{% endblock %}

{% block content %}
    <p>Choose a band:</p>
    <ul>
        {% for band in bands %}
            <li><a href="{% url 'band:band_home' band.slug %}">{{ band.name }}</a></li>
        {% endfor %}
    </ul>
{% endblock %}
